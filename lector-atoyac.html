const pages=[{"number": 1, "title": "UNA VIDA NUEVA. UN RÍO POR DESCUBRIR", "type": "historia", "layout": null, "dialogues": []}, {"number": 2, "title": "CASA PALENQUE", "type": "historia", "layout": {"panels": [{"x": 5, "y": 14, "w": 90, "h": 27, "note": "Vista desde la puerta de una habitación pequeña, cálida y rústica. Gus entre ropa, cámara, dibujos y zapatos.", "image": "atoyac-p02-escena-1.png", "scene": 1}, {"x": 5, "y": 43, "w": 44, "h": 23, "note": "Teléfono con el chat. Los mensajes se leen en pantalla.", "image": "atoyac-p02-escena-2.png", "scene": 2}, {"x": 51, "y": 43, "w": 44, "h": 23, "note": "Cámara a ras de suelo. Gus busca bajo la cama; el intercambio continúa por chat.", "image": "atoyac-p02-escena-3.png", "scene": 3}, {"x": 5, "y": 68, "w": 90, "h": 24, "note": "Gus sale decidido y regresa por sus zapatos. La salida avanza hacia la derecha.", "image": "atoyac-p02-escena-4.png", "scene": 4}], "quotes": [{"x": 7, "y": 15.5, "w": 56, "h": 3.7, "text": "En algun lugar de Cholula, Puebla. Mexico.", "voice": "Narrador", "kind": "narrator", "side": "left", "id": "B1-Q1"}, {"x": 23.2, "y": 47.4, "w": 9.4, "h": 4.4, "text": "Ya estas listo o que??", "voice": "Amigo", "kind": "chat phone", "side": "left", "id": "B2-Q1"}, {"x": 24, "y": 53, "w": 9.4, "h": 5.5, "text": "Bro, llevo media hora listo", "voice": "Gus", "kind": "chat phone", "side": "right", "id": "B2-Q2"}, {"x": 53, "y": 44.5, "w": 40, "h": 3.7, "text": "Ya sal, ya estoy afuera", "voice": "Amigo", "kind": "chat", "side": "left", "id": "B3-Q1"}, {"x": 53, "y": 48.8, "w": 40, "h": 3.7, "text": "Aguanta, me falta algo", "voice": "Gus", "kind": "chat", "side": "right", "id": "B3-Q2"}, {"x": 7, "y": 69.5, "w": 38, "h": 3.7, "text": "Los tenis, sabia que me faltaba algo", "voice": "Gus", "kind": "speech", "side": "left", "id": "B4-Q1"}]}, "dialogues": [{"id": "B1-Q1", "block": "B1", "position": "Q1", "voice": "Cartela", "kind": "narrator", "text": "En algun lugar de Cholula, Puebla. Mexico.", "original": "Cholula, Puebla. Antes de que todo cambiara."}, {"id": "B2-Q1", "block": "B2", "position": "Q1", "voice": "Amigo", "kind": "chat", "text": "Ya estas listo o que??", "original": "¿Ya estás listo?"}, {"id": "B2-Q2", "block": "B2", "position": "Q2", "voice": "Gus", "kind": "chat", "text": "Bro, llevo media hora listo", "original": "Desde hace media hora."}, {"id": "B3-Q1", "block": "B3", "position": "Q1", "voice": "Amigo", "kind": "speech", "text": "Ya sal, ya estoy afuera", "original": "Entonces sal."}, {"id": "B3-Q2", "block": "B3", "position": "Q2", "voice": "Gus", "kind": "speech", "text": "Aguanta, me falta algo", "original": "Me falta una cosa mínima."}, {"id": "B4-Q1", "block": "B4", "position": "Q1", "voice": "Gus", "kind": "speech", "text": "Los tenis, sabia que me faltaba algo", "original": "La dignidad empieza por el calzado."}]}, {"number": 3, "title": "QUERER MÁS SIN DESPRECIAR LO QUE TIENES", "type": "historia", "layout": {"panels": [{"x": 5, "y": 14, "w": 90, "h": 23, "note": "Madre a la izquierda y Gus a la derecha. Encuentro familiar cálido.", "image": "atoyac-p03-escena-1.png", "scene": "p03-1"}, {"x": 5, "y": 39, "w": 90, "h": 25, "note": "Papá sentado a la izquierda bromea sobre los platos; Gus reacciona junto a la puerta y mamá permanece al fondo.", "image": "atoyac-p03-escena-2.png", "scene": "p03-2"}, {"x": 5, "y": 66, "w": 90, "h": 26, "note": "Desde fuera de la puerta, Gus gira la cabeza y mira su casa con cariño.", "image": "atoyac-p03-escena-3.png", "scene": "p03-3"}], "quotes": [{"x": 7, "y": 15.5, "w": 32, "h": 3.7, "text": "Gus, no llegues tardisimo", "voice": "Madre", "kind": "speech", "side": "left", "id": "B1-Q1"}, {"x": 53, "y": 15.5, "w": 33, "h": 3.7, "text": "Que tan tarde es tardisimo??", "voice": "Gus", "kind": "speech", "side": "right", "id": "B1-Q2"}, {"x": 7, "y": 40, "w": 35, "h": 3, "text": "En tu casa tu pondras tus reglas", "voice": "Padre", "kind": "speech", "side": "left", "id": "B2-Q1"}, {"x": 53, "y": 40, "w": 33, "h": 3, "text": "Mama ya estoy grande", "voice": "Gus", "kind": "speech", "side": "right", "id": "B2-Q2"}, {"x": 7, "y": 43.6, "w": 30, "h": 2.8, "text": "Agradece esto hijo", "voice": "Padre", "kind": "speech", "side": "left", "id": "B2-Q3"}, {"x": 7, "y": 67.5, "w": 45, "h": 6, "text": "Gus amaba vivir con sus padres, tambien queria vivir la experiencia de vivir solo", "voice": "Narrador", "kind": "narrator", "side": "left", "id": "B3-Q1"}]}, "dialogues": [{"id": "B1-Q1", "block": "B1", "position": "Q1", "voice": "Madre", "kind": "speech", "text": "Gus, no llegues tardisimo", "original": "No llegues tardísimo."}, {"id": "B1-Q2", "block": "B1", "position": "Q2", "voice": "Gus", "kind": "speech", "text": "Que tan tarde es tardisimo??", "original": "Definamos tardísimo."}, {"id": "B2-Q1", "block": "B2", "position": "Q1", "voice": "Padre", "kind": "speech", "text": "En tu casa tu pondras tus reglas", "original": "Algún día tendrás tus propias reglas."}, {"id": "B2-Q2", "block": "B2", "position": "Q2", "voice": "Gus", "kind": "speech", "text": "Mama ya estoy grande", "original": "¿Y sus propios platos sucios?"}, {"id": "B2-Q3", "block": "B2", "position": "Q3", "voice": "Padre", "kind": "speech", "text": "Agradece esto hijo", "original": "Especialmente esos."}, {"id": "B3-Q1", "block": "B3", "position": "Q1", "voice": "Cartela", "kind": "narrator", "text": "Gus amaba vivir con sus padres, tambien queria vivir la experiencia de vivir solo", "original": "No quería escapar de su vida. Quería descubrir qué podía hacer con ella."}]}, {"number": 4, "title": "TRES BOLETOS Y UNA PÉSIMA INVERSIÓN", "type": "historia", "layout": null, "dialogues": [{"id": "B1-Q1", "block": "B1", "position": "Q1", "voice": "Vendedor", "kind": "speech", "text": "¡Quedan tres boletos! ¡Esta casa puede ser tuya!", "original": "¡Últimos tres boletos! ¡La casa puede ser tuya!"}, {"id": "B2-Q1", "block": "B2", "position": "Q1", "voice": "Amigo", "kind": "speech", "text": "Ni lo pienses.", "original": "Ni se te ocurra."}, {"id": "B2-Q2", "block": "B2", "position": "Q2", "voice": "Gus", "kind": "speech", "text": "Piénsalo: podría ganar.", "original": "Es una oportunidad estadística."}, {"id": "B3-Q1", "block": "B3", "position": "Q1", "voice": "Amigo", "kind": "speech", "text": "¿Y por qué ese?", "original": "¿Por qué ése?"}, {"id": "B3-Q2", "block": "B3", "position": "Q2", "voice": "Gus", "kind": "speech", "text": "Tres cuatros. Me convence.", "original": "Tiene tres cuatros."}, {"id": "B4-Q1", "block": "B4", "position": "Q1", "voice": "Amigo", "kind": "speech", "text": "Recuérdame no prestarte dinero.", "original": "Qué alivio que no trabajes en finanzas."}, {"id": "B5-Q1", "block": "B5", "position": "Q1", "voice": "Gus", "kind": "speech", "text": "Cuando gane, te juro que no los invito.", "original": "Cuando gane, no están invitados."}, {"id": "B5-Q2", "block": "B5", "position": "Q2", "voice": "Amigo", "kind": "speech", "text": "Perfecto. No ayudo con la mudanza.", "original": "Gracias. Me ahorro cargar muebles."}], "editorial": true}, {"number": 5, "title": "LA CHICA ENTRE LAS LUCES", "type": "historia", "layout": null, "dialogues": [{"id": "B1-Q1", "block": "B1", "position": "Q1", "voice": "Gus", "kind": "speech", "text": "Creo que me acabo de enamorar.", "original": "Creo que me enamoré."}, {"id": "B2-Q1", "block": "B2", "position": "Q1", "voice": "Amigo", "kind": "speech", "text": "¿Otra vez?", "original": "¿Otra vez?"}, {"id": "B2-Q2", "block": "B2", "position": "Q2", "voice": "Gus", "kind": "speech", "text": "Esta vez va en serio.", "original": "Esta vez con fundamento."}, {"id": "B3-Q1", "block": "B3", "position": "Q1", "voice": "Gus", "kind": "speech", "text": "¡Permiso! ¡Se me va el amor de mi vida!", "original": "¡Permiso! ¡Situación sentimental!"}, {"id": "B4-Q1", "block": "B4", "position": "Q1", "voice": "Amigo", "kind": "speech", "text": "Ni sabes cómo se llama.", "original": "Ni siquiera sabes cómo se llama."}, {"id": "B4-Q2", "block": "B4", "position": "Q2", "voice": "Gus", "kind": "speech", "text": "Iba a empezar por ahí.", "original": "Justo por eso debo investigar."}], "editorial": "nath", "narration": "Entre puestos y luces, Gus vio a una chica riendo con sus amigas. Por un momento, se olvidó del boleto."}, {"number": 6, "title": "LA ELECCIÓN", "type": "historia", "layout": null, "dialogues": [{"id": "B1-Q1", "block": "B1", "position": "Q1", "voice": "Nath", "kind": "speech", "text": "Ese te queda bien.", "original": "Buena elección."}, {"id": "B2-Q1", "block": "B2", "position": "Q1", "voice": "Gus", "kind": "speech", "text": "Sí... estaba viendo si combina.", "original": "Es que estaba comprobando si combina."}, {"id": "B3-Q1", "block": "B3", "position": "Q1", "voice": "Nath", "kind": "speech", "text": "¿Con una camiseta negra?", "original": "¿Con tu camiseta negra?"}, {"id": "B3-Q2", "block": "B3", "position": "Q2", "voice": "Gus", "kind": "speech", "text": "No quería arriesgarme.", "original": "Un análisis complejo."}, {"id": "B4-Q1", "block": "B4", "position": "Q1", "voice": "Nath", "kind": "speech", "text": "Apenas llevas treinta segundos.", "original": "Llevas treinta segundos aquí."}, {"id": "B4-Q2", "block": "B4", "position": "Q2", "voice": "Gus", "kind": "speech", "text": "Contigo mirando, se sienten más.", "original": "Trabajo rápido bajo presión."}], "editorial": "collar"}];

const rect=r=>`left:${r.x}%;top:${r.y}%;width:${r.w}%;height:${r.h}%`;
function visible(){return mq.matches||current===0||current===pages.length-1?[current]:[current,current+1]}
function pageHTML(i){const p=pages[i];let content,style='';if(i===0){style='cover';content='<img src="atoyac-portada-001.png" alt="Portada actual de Do For Love, Una vida nueva. Un río por descubrir." width="1024" height="1536"><button onclick="move(1)">ABRIR REVISTA ↗</button>'}else if(p.editorial==='collar'){style='fair-editorial collar-editorial';const ranges=[[0,1],[1,2],[2,4],[4,6]],alts=['Gus examina un collar plateado en el puesto.','Gus gira sorprendido al escuchar a Nath.','Nath y Gus conversan sobre el collar.','Gus y Nath comparten una mirada cómplice.'];content=`<h1>${esc(p.title)}</h1><div class="collar-grid">${ranges.map(([a,b],j)=>`<section class="collar-scene"><img src="atoyac-p06-escena-${j+1}.png" alt="${alts[j]}"><div class="fair-talk">${p.dialogues.slice(a,b).map(q=>`<p><b>${esc(q.voice)}</b>${esc(q.text)}</p>`).join('')}</div></section>`).join('')}</div>`}else if(p.editorial==='nath'){style='fair-editorial nath-editorial';const lines=(a,b)=>p.dialogues.slice(a,b).map(q=>`<p><b>${esc(q.voice)}</b> ${esc(q.text)}</p>`).join('');content=`<h1>${esc(p.title)}</h1><figure class="fair-main"><img src="atoyac-p05-escena-1.png" alt="Nath ríe con sus amigas mientras Gus la descubre al fondo de la feria."></figure><div class="fair-intro"><span>CHOLULA / FICCIÓN</span><p>${esc(p.narration)}</p><div class="fair-talk">${lines(0,1)}</div></div><figure class="fair-detail ticket-detail"><img src="atoyac-p05-escena-2.png" alt="El amigo mira a Gus con incredulidad; Gus sigue pendiente de Nath."></figure><figure class="fair-detail friends-detail"><img src="atoyac-p05-escena-3.png" alt="Gus pide permiso para abrirse paso entre la multitud mientras su amigo lo sigue."></figure><div class="fair-caption ticket-caption"><span>¿OTRA VEZ?</span><div class="fair-talk">${lines(1,3)}</div></div><div class="fair-caption friends-caption"><span>ENTRE LA MULTITUD</span><div class="fair-talk">${lines(3,6)}</div></div>`}else if(p.editorial){style='fair-editorial';const lines=(start,end)=>p.dialogues.slice(start,end).map(q=>`<p><b>${esc(q.voice)}</b> ${esc(q.text)}</p>`).join('');content=`<h1>${esc(p.title)}</h1><figure class="fair-main"><img src="atoyac-p04-escena-1.png" alt="Gus y su amigo frente al vendedor y los tres boletos del sorteo."></figure><div class="fair-intro"><span>CHOLULA / FICCIÓN</span><p>Entre las luces de la feria, un puesto detuvo a Gus. Quedaban tres boletos y una casa por ganar.</p><div class="fair-talk">${lines(0,3)}</div></div><figure class="fair-detail ticket-detail"><img src="atoyac-p04-boletos-final.png" alt="Gus elige el boleto amarillo, número 01444."></figure><figure class="fair-detail friends-detail"><img src="atoyac-p04-escena-3.png" alt="Gus guarda su boleto y se aleja del puesto bromeando con su amigo."></figure><div class="fair-caption ticket-caption"><span>LA ELECCIÓN / 01444</span><div class="fair-talk">${lines(3,5)}</div></div><div class="fair-caption friends-caption"><span>UNA CASA POR GANAR</span><div class="fair-talk">${lines(5,8)}</div></div>`}else if(p.layout){style='comic';content=`<h1>${esc(p.title)}</h1>`+p.layout.panels.map((r,j)=>`<div class="panel ${r.image?'illustrated scene-'+r.scene:''}" style="${rect(r)}">${r.image?`<img src="${r.image}" alt="${esc(r.note)}" decoding="async">`:`<span class="art-marker">ILUSTRACIÓN PENDIENTE</span>`}</div>`).join('')+p.layout.quotes.map(q=>`<p class="quote ${q.kind} ${q.side}" style="${rect(q)}" aria-label="${esc(q.voice)}: ${esc(q.text)}">${esc(q.text)}</p>`).join('')}else{style='placeholder '+p.type;content=`<div class="placeholder-body"><div class="type">${p.type==='archivo'?'ARCHIVO ATOYAC':p.type==='publicidad'?'ESPACIO COMERCIAL':'HISTORIA ILUSTRADA'}</div><span class="number">${String(p.number).padStart(2,'0')}</span><h2>${esc(p.title)}</h2><p>Página reservada según la guía.<br>Maquetación y arte pendientes.${p.dialogues?.length?'<br><small>Diálogos corregidos en «Leer diálogos».</small>':''}</p></div>`}return `<article class="page ${style} page-${p.number}" aria-label="Página ${p.number}: ${esc(p.title)}">${content}${i===0?'':`<footer class="folio"><span>DO FOR LOVE</span><span>${String(p.number).padStart(2,'0')}</span></footer>`}</article>`}
function render(d=0){const shown=visible();book.className='book'+(shown.length===1?' single':'');book.innerHTML=shown.map(pageHTML).join('');if(d){void book.offsetWidth;book.classList.add(d>0?'turn-next':'turn-prev')}document.querySelector('#position').textContent=shown.map(i=>i+1).join(' — ')+' / '+pages.length;document.querySelector('#prev').disabled=current===0;document.querySelector('#next').disabled=shown.at(-1)===pages.length-1;document.querySelector('#jump').value=current;}

function go(n){let target=Math.max(0,Math.min(pages.length-1,n));if(!mq.matches&&target>0&&target<pages.length-1&&target%2===0)target--;const d=target-current;current=target;render(d)}
function move(d){if(d>0){if(visible().at(-1)===pages.length-1)return;go(visible().at(-1)+1)}else{if(current===0)return;go(current-(mq.matches?1:2))}}
function showDialog(mode){const el=document.querySelector('#dialogContent');el.className='dialog-content '+mode;if(mode==='visual'){el.innerHTML='<p class="dialog-hint">Vista ampliada. Desplázate para recorrer la página.</p>'+visible().map(pageHTML).join('')}else{el.innerHTML='<div class="transcript">'+visible().map(i=>{const p=pages[i];return `<section><h2>${p.number}. ${esc(p.title)}</h2>${p.narration?`<p><span class="speaker">Narrador</span>${esc(p.narration)}</p>`:''}${p.dialogues?.length?p.dialogues.map(q=>`<p><span class="speaker">${esc(q.voice)}${q.kind.includes('chat')?' · mensaje':''}</span>${esc(q.text)}</p>`).join(''):'<p>Esta página no contiene diálogos. Su contenido editorial o comercial sigue pendiente de maquetación.</p>'}</section>`}).join('')+'</div>'}dialog.showModal();dialog.scrollTop=0;}
document.querySelector('#jump').innerHTML=pages.map((p,i)=>`<option value="${i}">${String(i+1).padStart(2,'0')}. ${esc(p.title)}</option>`).join('');document.querySelector('#jump').onchange=e=>go(Number(e.target.value));document.querySelector('#prev').onclick=()=>move(-1);document.querySelector('#next').onclick=()=>move(1);document.querySelector('#zoom').onclick=()=>showDialog('visual');document.querySelector('#read').onclick=()=>showDialog('text');document.querySelector('#close').onclick=()=>dialog.close();document.addEventListener('keydown',e=>{if(dialog.open||['SELECT','INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();move(1)}if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}});let touch=null;book.addEventListener('touchstart',e=>{if(e.touches.length!==1){touch=null;return}touch=[e.changedTouches[0].clientX,e.changedTouches[0].clientY]},{passive:true});book.addEventListener('touchend',e=>{if(!touch)return;const dx=e.changedTouches[0].clientX-touch[0],dy=e.changedTouches[0].clientY-touch[1];if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.5)move(dx<0?1:-1);touch=null},{passive:true});mq.addEventListener('change',()=>go(current));render();
</script></body></html>
